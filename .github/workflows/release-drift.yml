name: Release drift

# A merged release PR publishes nothing: the tag is the trigger and pushing it is
# manual. qrspi 0.1.1 sat on main untagged for a week and nothing said so. This says so.
#
# It fails when VERSION has no v<version> tag, once the commit
# that set the version is older than the grace a release PR needs between merging
# and tagging. It runs on push so a bump is checked, and daily so a quiet repo still
# hears about a tag nobody pushed — a failing scheduled run emails the owner.
#
# A version whose CHANGELOG section opens with "Not released" is one that was never meant
# to be tagged (0.0.1: the first binary, before the latency method is decided); it passes
# with a notice. The marker goes when the section becomes a release.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The check lives in backlogsync, shared by every repository that releases by tag
  # (WB-7): VERSION against a v<version> tag, and a CHANGELOG section that opens with
  # "Not released" passes with a notice.
  drift:
    uses: Allan-Nava/backlogsync/.github/workflows/release-drift.yml@backlogsync--v0.1.0
    with:
      version-file: VERSION
      tag-prefix: v
