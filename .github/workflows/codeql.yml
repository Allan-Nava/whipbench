name: CodeQL

# Static analysis of the Go code. whipbench parses SDP, RTP and files it is handed,
# and talks HTTP to servers it does not control; the bar is high.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
