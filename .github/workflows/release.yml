name: Release

# On a tag v<version> matching VERSION: test, build static binaries for linux and
# darwin on amd64 and arm64, attach them with a checksum file to a GitHub release
# whose notes are the CHANGELOG section, attest their build provenance, and close
# the milestone. Re-run with `gh workflow run Release -f tag=v0.1.0`; every step is
# idempotent.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write
  issues: write
  # The provenance attestation ties each binary to this workflow and this tag
  # without anybody holding a signing key.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: v
        name: Resolve and verify the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          TAG_VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d ' \n' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag $TAG says $TAG_VERSION but VERSION says $FILE_VERSION"; exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
      - run: go test -race -count=1 ./...
      - name: Build static binaries
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath \
              -ldflags "-s -w -X github.com/Allan-Nava/whipbench/internal/version.Version=v$V" \
              -o "dist/whipbench-v$V-${target%/*}-${target#*/}" ./cmd/whipbench
          done
          (cd dist && sha256sum whipbench-* > "whipbench-v$V-checksums.txt" && cat "whipbench-v$V-checksums.txt")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/whipbench-v${{ steps.v.outputs.version }}-checksums.txt
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          NOTES="$(awk -v v="$V" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "whipbench v$V" --notes "$NOTES"
          fi
      - name: Close the milestone
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          NUM=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open" --jq ".[] | select(.title | startswith(\"v$V\")) | .number" | head -1)
          [ -z "$NUM" ] && { echo "no open milestone starts with v$V"; exit 0; }
          OPEN=$(gh api "repos/$GITHUB_REPOSITORY/milestones/$NUM" --jq .open_issues)
          [ "$OPEN" != "0" ] && { echo "milestone $NUM still has $OPEN open issues — left open"; exit 0; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$NUM" -f state=closed >/dev/null && echo "closed milestone $NUM"
