name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gofmt, vet, the tests under the race detector — unit tests and real publisher →
  # relay → viewer round trips through internal/testserver on loopback, no external
  # server — then static builds for the four targets a release ships.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build static binaries
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -ldflags "-s -w" -o "dist/whipbench-${target%/*}-${target#*/}" ./cmd/whipbench
          done
          file dist/* && ls -la dist/
      # VERSION vs CHANGELOG vs README, and the statements the README must carry.
      - run: ./scripts/check-repo.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # goinstall, not the release binary: v2.12.2's binary is built with Go 1.26 and
      # refuses a module that targets 1.27; built here it uses the go.mod toolchain.
      # staticcheck and unused are off in CI until their IR builder (honnef.co/go/tools
      # v0.7.0) handles Go 1.27's standard library — it panics in internal/poll,
      # 2026-10-01. Run them locally with a toolchain that does; go vet covers the rest.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --disable=staticcheck --disable=unused

  # Nothing private in the tracked files or anywhere in the history: home paths, file
  # URLs, e-mail addresses, private IPs, credential-shaped strings, attribution
  # trailers, and the names on a private denylist when the LEAKCHECK_DENYLIST secret
  # is configured. The full history, because a forward fix leaves the leak readable.
  leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/leakcheck_test.mjs
      - run: node scripts/leakcheck.mjs
        env:
          LEAKCHECK_DENYLIST: ${{ secrets.LEAKCHECK_DENYLIST }}

  # BACKLOG.md is the single source of truth; ROADMAP.md is generated from it.
  backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # backlogsync, pinned to its release: a malformed item or a stale roadmap fails here;
      # the planner's own tests live in backlogsync (WB-7).
      - uses: Allan-Nava/backlogsync@backlogsync--v0.1.0
        with:
          command: check
